[package]
name = "craft"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A minimal code editor"
license = "GPL-3.0-or-later"
repository = "https://github.com/clayts/craft"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
sourceview = { package = "sourceview5", version = "0.11", features = ["v5_12"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
